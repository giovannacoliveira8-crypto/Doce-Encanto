<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot-Encantado | Doce Encanto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --rosa-claro: #FDF2F4;
            --rosa-medio: #FADADD;
            --rosa-escuro: #E8B4BC;
            --dourado: #C5A059;
            --dourado-hover: #B08D48;
            --texto-escuro: #4A3B3C;
            --texto-suave: #7A6869;
            --branco: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--rosa-claro), var(--rosa-medio));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--texto-escuro);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--branco);
            border: 1px solid var(--dourado);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(197, 160, 89, 0.18);
            overflow: hidden;
        }

        header {
            position: relative;
            background: linear-gradient(135deg, var(--rosa-medio), var(--rosa-claro));
            text-align: center;
            padding: 35px 25px 25px;
            border-bottom: 1px solid var(--dourado);
        }

        /* Estilo do Botão Voltar */
        .btn-voltar {
            position: absolute;
            top: 15px;
            left: 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background-color: var(--branco);
            color: var(--dourado);
            border: 1px solid var(--dourado);
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(197, 160, 89, 0.15);
        }

        .btn-voltar:hover {
            background-color: var(--dourado);
            color: var(--branco);
            transform: translateX(-2px);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--dourado);
            font-size: 2rem;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        header p {
            color: var(--texto-suave);
            font-size: 0.95rem;
        }

        .configuracao {
            padding: 20px 25px 10px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--texto-escuro);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--rosa-escuro);
            background-color: var(--rosa-claro);
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            font-size: 14px;
            color: var(--texto-escuro);
            transition: border-color 0.3s;
        }

        .chat {
            padding: 15px 25px 25px;
        }

        .mensagens {
            height: 350px;
            overflow-y: auto;
            background: var(--rosa-claro);
            border: 1px solid var(--rosa-medio);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mensagem {
            max-width: 82%;
            padding: 12px 16px;
            font-size: 0.92rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .bot {
            background: var(--branco);
            color: var(--texto-escuro);
            border: 1px solid var(--rosa-medio);
            border-radius: 16px 16px 16px 4px;
            align-self: flex-start;
            box-shadow: 0 2px 8px rgba(197, 160, 89, 0.08);
        }

        .usuario {
            background: var(--dourado);
            color: var(--branco);
            border-radius: 16px 16px 4px 16px;
            align-self: flex-end;
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.25);
        }

        .campo-mensagem {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            min-height: 75px;
            resize: vertical;
            padding: 12px 15px;
            border: 1px solid var(--rosa-escuro);
            background-color: var(--rosa-claro);
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--texto-escuro);
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--dourado);
            background-color: var(--branco);
        }

        button {
            background-color: var(--dourado);
            color: var(--branco);
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        button:hover {
            background-color: var(--dourado-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        footer {
            text-align: center;
            padding: 16px;
            background: var(--rosa-claro);
            color: var(--texto-suave);
            border-top: 1px solid var(--rosa-medio);
            font-size: 0.85rem;
        }

        @media (max-width: 500px) {
            .mensagens {
                height: 300px;
            }

            header {
                padding-top: 48px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header>
            <!-- TROQUE "index.html" PELO NOME DO ARQUIVO DO SEU SITE PRINCIPAL, SE FOR DIFERENTE -->
            <a href="index.html" class="btn-voltar">← Voltar ao site</a>
            <h1>🍰 Bot-Encantado</h1>
            <p>Assistente virtual da Doce Encanto</p>
        </header>

        <section class="configuracao" aria-label="Configuração da API">
            <label for="apiKey">Chave da API:</label>
            <input type="password" id="apiKey" placeholder="Digite sua chave da API" autocomplete="off" required>
        </section>

        <section class="chat" aria-label="Área de conversa">
            <div id="mensagens" class="mensagens" role="log" aria-live="polite">
                <div class="mensagem bot">
                    Olá! Sou o Bot-Encantado. Como posso adoçar o seu dia hoje?
                </div>
            </div>

            <div class="campo-mensagem">
                <textarea id="mensagem" placeholder="Digite sua dúvida sobre nossos doces, bolos ou encomendas..."
                    rows="3"></textarea>

                <button type="button" id="btnEnviar">Enviar ✨</button>
            </div>
        </section>

        <footer>
            <p>Doce Encanto — Transformando doces em momentos mágicos!</p>
        </footer>

    </main>

    <script src="scriptChatEmpresa.js"></script>

</body>

</html>
